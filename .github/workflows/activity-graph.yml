name: Update Contribution Lifeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate contribution lifeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets

          python3 <<'PY'
          import json
          import os
          import urllib.request

          username = "PawanForge"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "PawanForge-GitHub-Action"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.load(response)

          if result.get("errors"):
              print(json.dumps(result["errors"], indent=2))
              raise SystemExit("GitHub GraphQL request failed")

          weeks = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          daily = []

          for week in weeks:
              for day in week["contributionDays"]:
                  daily.append(day["contributionCount"])

          # Last 364 days
          daily = daily[-364:]

          # Convert daily contributions into weekly values
          weekly = []

          for i in range(0, len(daily), 7):
              weekly.append(sum(daily[i:i + 7]))

          weekly = weekly[-52:]

          WIDTH = 900
          HEIGHT = 280
          PAD = 35

          maximum = max(weekly) if weekly else 1

          points = []

          for i, value in enumerate(weekly):
              x = PAD + (
                  i * (WIDTH - PAD * 2) /
                  max(1, len(weekly) - 1)
              )

              y = (
                  HEIGHT
                  - PAD
                  - (value / maximum) * (HEIGHT - PAD * 2)
              )

              points.append(f"{x:.2f},{y:.2f}")

          line = " ".join(points)

          first_x = PAD
          last_x = WIDTH - PAD
          bottom = HEIGHT - PAD

          area = (
              f"{first_x},{bottom} "
              f"{line} "
              f"{last_x},{bottom}"
          )

          svg = f"""<?xml version="1.0" encoding="UTF-8"?>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            width="{WIDTH}"
            height="{HEIGHT}">

            <rect
              width="100%"
              height="100%"
              rx="18"
              fill="#0d1117"/>

            <polygon
              points="{area}"
              fill="#00e5ff"
              opacity="0.10"/>

            <polyline
              points="{line}"
              fill="none"
              stroke="#00e5ff"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"/>

          </svg>
          """

          with open("assets/contribution-lifeline.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print("Contribution lifeline created successfully.")
          PY

      - name: Verify generated SVG
        run: |
          test -f assets/contribution-lifeline.svg
          echo "SVG exists:"
          ls -lh assets/contribution-lifeline.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-lifeline.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update contribution lifeline"
            git push
          fi
