name: Contribution Lifeline

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import os
          import urllib.request
          import json
          import datetime

          user = "PawanForge"

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          data = json.dumps({
              "query": query,
              "variables": {"login": user}
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=data,
              headers={
                  "Authorization": "bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json"
              }
          )

          result = json.load(urllib.request.urlopen(req))

          weeks = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          values = [
              day["contributionCount"]
              for week in weeks
              for day in week["contributionDays"]
          ]

          values = values[-52:]

          width = 900
          height = 260
          padding = 30

          maximum = max(values) if values else 1

          points = []

          for i, value in enumerate(values):
              x = padding + i * ((width - 2 * padding) / max(1, len(values) - 1))

              y = height - padding - (
                  value / maximum
              ) * (height - 2 * padding)

              points.append(f"{x:.1f},{y:.1f}")

          polyline = " ".join(points)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 {width} {height}"
          width="{width}" height="{height}">

          <rect width="100%" height="100%" fill="#0d1117"/>

          <polyline
            points="{polyline}"
            fill="none"
            stroke="#00e5ff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>

          <polyline
            points="{polyline} {width-padding},{height-padding} {padding},{height-padding}"
            fill="#00e5ff"
            opacity="0.08"/>

          </svg>'''

          with open("assets/contribution-lifeline.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-lifeline.svg
          git diff --cached --quiet || git commit -m "Update contribution lifeline"
          git push
