```yaml
name: Contribution Lifeline

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets

          python3 <<'PY'
          import os
          import json
          import urllib.request

          username = "PawanForge"

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          data = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=data,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise Exception(result["errors"])

          weeks = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          values = [
              day["contributionCount"]
              for week in weeks
              for day in week["contributionDays"]
          ]

          # Last 52 weeks
          values = values[-364:]

          # Weekly totals
          weekly = []

          for i in range(0, len(values), 7):
              weekly.append(sum(values[i:i+7]))

          weekly = weekly[-52:]

          width = 900
          height = 260
          padding = 30

          maximum = max(weekly) if weekly else 1

          points = []

          for i, value in enumerate(weekly):
              x = padding + (
                  i * (width - padding * 2) /
                  max(1, len(weekly) - 1)
              )

              y = height - padding - (
                  value / maximum
              ) * (height - padding * 2)

              points.append(f"{x:.2f},{y:.2f}")

          line = " ".join(points)

          area = (
              f"{padding},{height-padding} "
              f"{line} "
              f"{width-padding},{height-padding}"
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 {width} {height}">

          <rect width="100%" height="100%" rx="15" fill="#0d1117"/>

          <polygon
            points="{area}"
            fill="#00e5ff"
            opacity="0.08"/>

          <polyline
            points="{line}"
            fill="none"
            stroke="#00e5ff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>

          </svg>'''

          with open("assets/contribution-lifeline.svg", "w") as f:
              f.write(svg)

          print("Contribution graph generated.")
          PY

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-lifeline.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update contribution lifeline"
            git push
          fi
```
